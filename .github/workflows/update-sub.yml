name: Update VLESS Subscription

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and merge subscriptions
        env:
          SUB1: ${{ secrets.SUB1 }}
          SUB2: ${{ secrets.SUB2 }}
          SUB3: ${{ secrets.SUB3 }}
        run: |
          python3 <<'PY'
          import os
          import base64
          import urllib.request

          urls = [
              os.environ["SUB1"],
              os.environ["SUB2"],
              os.environ["SUB3"]
          ]

          result = []
          seen = set()

          for url in urls:
              try:
                  req = urllib.request.Request(
                      url,
                      headers={"User-Agent": "Mozilla/5.0"}
                  )

                  data = urllib.request.urlopen(req, timeout=30).read()
                  text = data.decode("utf-8", errors="ignore")

                  # Try plain text first
                  lines = text.splitlines()
                  vless = [x.strip() for x in lines if x.strip().startswith("vless://")]

                  # If no VLESS was found, try Base64 decoding
                  if not vless:
                      try:
                          decoded = base64.b64decode(
                              "".join(text.split()),
                              validate=False
                          ).decode("utf-8", errors="ignore")

                          vless = [
                              x.strip()
                              for x in decoded.splitlines()
                              if x.strip().startswith("vless://")
                          ]
                      except Exception:
                          pass

                  for node in vless:
                      if node not in seen:
                          seen.add(node)
                          result.append(node)

                  print(f"Processed subscription: {len(vless)} VLESS nodes")

              except Exception as e:
                  print(f"Subscription failed: {e}")

          with open("subscription.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(result) + "\n")

          encoded = base64.b64encode(
              "\n".join(result).encode("utf-8")
          ).decode("ascii")

          with open("subscription_base64.txt", "w", encoding="utf-8") as f:
              f.write(encoded)

          print(f"Total unique VLESS nodes: {len(result)}")
          PY

      - name: Commit updated subscription
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add subscription.txt subscription_base64.txt

          git diff --cached --quiet || \
            git commit -m "Update subscription"

          git push
